# CI/CD: build on the GitHub runner, then rsync the build to the DigitalOcean droplet and reload PM2.
# Building on the runner avoids out-of-memory builds on the shared droplet.
#
# Required repository SECRETS:   DO_SSH_PRIVATE_KEY, DO_HOST, DO_USER
# Required repository VARIABLES: DO_APP_PATH (e.g. /var/www/canyon-construction),
#                                NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_GTM_ID, NEXT_PUBLIC_FORM_ENDPOINT
# NEXT_PUBLIC_* values are inlined at build time, so they must be set here, not only on the server.
# Details and one-time server setup: docs/08-deploy-digitalocean.md
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: >=22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:content
      - run: npm run check:redirects
      - run: npm run build
      # next-env.d.ts is gitignored and generated by `next build`, so typecheck runs after it.
      - run: npm run typecheck

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DO_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Keep the connection alive during long silent steps such as `npm ci` on the droplet.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n  ConnectTimeout 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # -R keeps relative paths (src/content/blog stays under src/). --delete only prunes inside the
      # directories listed here (.next, public, src/content/blog), never other files in DO_APP_PATH.
      # redirects.mjs is imported by next.config.mjs, so it must be on the server.
      - name: Upload build
        env:
          SSH_USER: ${{ secrets.DO_USER }}
          SSH_HOST: ${{ secrets.DO_HOST }}
          APP_PATH: ${{ vars.DO_APP_PATH }}
        run: |
          test -n "$APP_PATH" || { echo "DO_APP_PATH is empty"; exit 1; }
          rsync -azR --delete \
            --exclude='.next/cache/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next public src/content/blog \
            package.json package-lock.json next.config.mjs redirects.mjs ecosystem.config.cjs \
            "$SSH_USER@$SSH_HOST:$APP_PATH/"

      - name: Install production dependencies and reload PM2
        env:
          SSH_USER: ${{ secrets.DO_USER }}
          SSH_HOST: ${{ secrets.DO_HOST }}
          APP_PATH: ${{ vars.DO_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd '$APP_PATH' && npm ci --omit=dev --no-audit --no-fund --loglevel=http && pm2 startOrReload ecosystem.config.cjs --update-env && pm2 save"

      - name: Health check
        env:
          SSH_USER: ${{ secrets.DO_USER }}
          SSH_HOST: ${{ secrets.DO_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "curl -fsS --retry 6 --retry-delay 3 --retry-connrefused -o /dev/null http://127.0.0.1:3008/ && echo 'App is up on 127.0.0.1:3008'"
